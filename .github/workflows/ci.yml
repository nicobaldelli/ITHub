name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo, openssl, zip
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer test

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # La versión sale de "packageManager" en web/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Solo para que el build no falle por la validación de api.ts;
          # el artefacto de CI no se deploya.
          NEXT_PUBLIC_API_URL: https://apithub.intellihelp.tech/api/v1
